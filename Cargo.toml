[package]
name = "archiver"
version = "0.1.0"
edition = "2021"
description = "Local-first CLI utility that creates, lists, and extracts file archives"
license = "MIT"
readme = "README.md"

[[bin]]
name = "archiver"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = { version = "0.13", features = ["zstdmt"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"

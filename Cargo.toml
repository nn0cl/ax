[package]
name = "archiver"
version = "0.0.1"
edition = "2021"
# Minimum Supported Rust Version (raise if CI/tooling requires)
rust-version = "1.74"
description = "Media-fit local-first pack/restore archiver (USB / optical unit sizing)"
authors = ["nn0cl <nn0cl@dstechnology.co.jp>"]
license = "LicenseRef-AllRightsReserved"
readme = "README.md"
# Copyright (c) nn0cl@dstechnology.co.jp. All rights reserved.

[[bin]]
name = "archiver"
path = "src/main.rs"

[dependencies]
# SemVer ranges in Cargo.toml; exact resolved versions are in Cargo.lock
# (see docs/INSTALL.md § Dependency versions).
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = { version = "0.13", features = ["zstdmt"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
